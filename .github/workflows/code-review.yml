name: Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anglesen1120/code-review-agent@v1
        with:
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          # PAT is required for the agent to auto-resolve the threads it posts
          # (GITHUB_TOKEN can post but cannot resolve review threads).
          github-token: ${{ secrets.CODE_REVIEW_TOKEN }}
          bot-login: anglesen1120
